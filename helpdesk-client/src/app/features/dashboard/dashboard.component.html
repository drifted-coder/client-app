<div class="container-fluid">

  <!-- STATUS COUNTS -->
  <div class="mb-4">
    <h5 class="mb-3 fw-semibold">Status Counts</h5>

    <div class="row">
      <div class="col-md-3" *ngFor="let item of statCounts">
        <div class="card shadow-sm border-0 p-3">
          <h6 class="text-muted">{{item.label}}</h6>
          <h3 class="mb-0">{{item.count}}</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- MY ASSIGNED TICKETS -->
  <div class="mb-4">
    <h5 class="mb-3 fw-semibold">My Assigned Tickets</h5>

    <div class="card shadow-sm border-0">
      <div class="card-body">

        <div *ngIf="recentTickets.length > 0; else noAssigned">

          <div class="border-bottom py-2"
               *ngFor="let t of recentTickets">

            <div class="fw-semibold">
              {{t.title}}
            </div>

            <small class="text-muted">
              {{t.status}} • {{t.priority}}
            </small>

          </div>

        </div>

        <ng-template #noAssigned>
          <div class="alert alert-info mb-0">
            No assigned tickets
          </div>
        </ng-template>

      </div>
    </div>
  </div>

  <!-- TICKETS LAST 7 DAYS -->
  <div>
    <h5 class="mb-3 fw-semibold">Tickets Last 7 Days</h5>

    <div class="card shadow-sm border-0">
      <div class="card-body">

        <div *ngIf="recentTickets.length > 0; else noRecent">

          <div class="border-bottom py-2"
               *ngFor="let t of recentTickets">

            <div class="fw-semibold">
              {{t.title}}
            </div>

            <small class="text-muted">
              {{t.createdAt | date:'mediumDate'}}
            </small>

          </div>

        </div>

        <ng-template #noRecent>
          <div class="alert alert-info mb-0">
            No tickets in last 7 days
          </div>
        </ng-template>

      </div>
    </div>
  </div>

</div>
