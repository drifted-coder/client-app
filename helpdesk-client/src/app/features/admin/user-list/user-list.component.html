<div class="card border-0 shadow-sm modern-user-card">

    <div class="card-header bg-white border-0">
        <h5 class="mb-0 fw-semibold">User Management</h5>
    </div>

    <div class="table-responsive">
        <table class="table align-middle modern-table mb-0">

            <thead>
                <tr>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Updated</th>
                    <th class="text-center">Actions</th>
                </tr>
            </thead>

            <tbody>

                <tr *ngFor="let user of userList" class="table-row-hover">

                    <td class="fw-medium">{{ user.email }}</td>

                    <td>
                        <span class="badge bg-light text-dark border">
                            {{ user.role }}
                        </span>
                    </td>

                    <td>
                        <span
                            class="badge rounded-pill"
                            [ngClass]="user.active ? 'bg-success-subtle text-success'
                                                   : 'bg-danger-subtle text-danger'">
                            {{ user.active ? 'Active' : 'Inactive' }}
                        </span>
                    </td>

                    <td class="text-muted small">
                        {{ user.createdAt | date:'short' }}
                    </td>

                    <td class="text-muted small">
                        {{ user.updatedAt | date:'short' }}
                    </td>

                    <td class="text-center">

                        <div class="d-flex justify-content-center gap-2 flex-wrap">

                            <button
                                class="btn btn-sm btn-outline-primary"
                                [disabled]="!user.active"
                                data-bs-toggle="modal"
                                data-bs-target="#roleModal"
                                (click)="setSelectedUser(user)">
                                Change Role
                            </button>

                            <button
                                class="btn btn-sm btn-outline-success"
                                data-bs-toggle="modal"
                                data-bs-target="#statusModal"
                                (click)="setSelectedUser(user)"
                                *ngIf="user.active==false">
                                Activate
                            </button>

                            <button
                                class="btn btn-sm btn-outline-danger"
                                data-bs-toggle="modal"
                                data-bs-target="#statusModal"
                                (click)="setSelectedUser(user)"
                                *ngIf="user.active==true">
                                Deactivate
                            </button>

                        </div>

                    </td>

                </tr>

            </tbody>

        </table>
    </div>

</div>


<div class="modal fade" id="statusModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Change Status</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" #closeModal></button>
      </div>

      <div class="modal-body">
        Are you sure you want to change the status?
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>

        <button class="btn btn-primary"
                (click)="confirmStatusChange(this.selectedUser)">
          Confirm
        </button>
      </div>

    </div>
  </div>
</div>

<!-- change roles modal -->
 <div class="modal fade" id="roleModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Change User Role</h5>
        <button type="button" class="btn-close"
                data-bs-dismiss="modal" #closeModalRole></button>
      </div>

      <div class="modal-body">

        <label class="form-label">Select Role</label>

        <select class="form-select"
                [(ngModel)]="selectedRole">

          <option value="">Select Role</option>
          <option *ngFor="let role of roles"
                  [value]="role">
            {{ role }}
          </option>

        </select>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary"
                data-bs-dismiss="modal">
          Cancel
        </button>

        <button class="btn btn-primary"
                (click)="submitRoleChange()">
          Submit
        </button>
      </div>

    </div>
  </div>
</div>
